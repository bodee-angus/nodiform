name: Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libudev-dev ffmpeg mesa-vulkan-drivers xvfb xauth desktop-file-utils zsync

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-nodiform-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-nodiform-rust-

      - name: Read release version
        id: version
        run: python3 -c 'import tomllib, os; v=tomllib.load(open("Cargo.toml","rb"))["package"]["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"],"a"))'

      - name: Test
        run: cargo test --locked

      - name: Exercise GPU pipelines with software Vulkan
        env:
          XDG_RUNTIME_DIR: /tmp
        run: cargo test --locked gpu::tests::headless_gpu_smoke -- --ignored --nocapture

      - name: Build release executable
        run: cargo build --release --locked

      - name: Build updateable AppImage
        run: bash packaging/package-appimage.sh

      - name: Test packaged command-line entry and embedded update information
        run: |
          dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --version
          test "$(dist/Nodiform-x86_64.AppImage --appimage-updateinformation)" = 'gh-releases-zsync|bodee-angus|nodiform|latest|Nodiform-x86_64.AppImage.zsync'

      - name: Test packaged native window, rules worker, and rendering
        env:
          XDG_RUNTIME_DIR: /tmp
          WINIT_UNIX_BACKEND: x11
        run: |
          mkdir -p ui-review
          NODIFORM_SMOKE_THEME=light NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/light-rules.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=abc NODIFORM_SMOKE_PARAMETERS='{"order":"branch-walk","ticksPerNode":6}' NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-permutations.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=abc NODIFORM_SMOKE_PARAMETERS='{"order":"connected-branch-walk","ticksPerNode":6}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-inputs.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=abc NODIFORM_SMOKE_PARAMETERS='{"order":"branch-walk","ticksPerNode":6}' NODIFORM_SMOKE_DEGREE=1 NODIFORM_SMOKE_EDGE_WIDTH=4 NODIFORM_SMOKE_SETTINGS=1 NODIFORM_SMOKE_COMPACT=1 NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-settings.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=light NODIFORM_SMOKE_EXAMPLE=complete NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/light-inputs.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_COMPACT=1 NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-compact.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=abc NODIFORM_SMOKE_PARAMETERS='{"order":"branch-walk","ticksPerNode":6}' NODIFORM_SMOKE_HIDPI=1 NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-hidpi.ppm" timeout 60s xvfb-run -a -s '-screen 0 3200x2000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=half NODIFORM_SMOKE_PARAMETERS='{"count":24,"interval":6}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-half-neighbourhood.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=prime NODIFORM_SMOKE_PARAMETERS='{"count":40,"ticksPerNode":0}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-prime-factors.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=pi NODIFORM_SMOKE_PARAMETERS='{"digits":40,"ticksPerDigit":0}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-pi-digits.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=divisors NODIFORM_SMOKE_PARAMETERS='{"count":40,"ticksPerNode":0}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-divisor-graph.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=torus NODIFORM_SMOKE_PARAMETERS='{"dimensions":2,"range":10,"ticksPerNode":0}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-toroidal-grid.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test

          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=fibonacci NODIFORM_SMOKE_PARAMETERS='{"maxNumber":20,"ticksPerNode":0,"ticksPerEdge":0,"finalTicks":24}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_EDGE_WIDTH=4 NODIFORM_SMOKE_COMPLETE=1 NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-fibonacci-complete.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=fibonacci NODIFORM_SMOKE_PARAMETERS='{"maxNumber":20,"ticksPerNode":0,"ticksPerEdge":0,"finalTicks":24,"colorBy":"fibonacci-membership"}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_EDGE_WIDTH=4 NODIFORM_SMOKE_INTENT=record NODIFORM_SMOKE_OUTPUT_DIR="$RUNNER_TEMP/nodiform-smoke-video" NODIFORM_SMOKE_COMPLETE=1 NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-fibonacci-recorded.ppm" timeout 60s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          python3 - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "nodiform-smoke-video"
          manifests = list(root.glob("*/manifest.json"))
          assert len(manifests) == 1, manifests
          manifest = json.loads(manifests[0].read_text())
          outcome = json.loads(manifests[0].with_name("run-outcome.json").read_text())
          assert manifest["status"] == "complete", manifest
          assert manifest["metadata"]["edge_width_multiplier"] == 4
          assert manifest["metadata"]["edge_width_rule"] == "world-with-pixel-floor-v1"
          assert manifest["metadata"]["edge_minimum_physical_pixels"] == 4
          assert manifest["metadata"]["planned_ticks"] == 264
          assert manifest["frames"] == 66, manifest["frames"]
          assert outcome["status"] == "completed", outcome
          assert outcome["actual_tick"] == 264, outcome
          assert (outcome["nodes"], outcome["edges"]) == (21, 23), outcome
          print("Recording completed: 264 ticks, 66 frames, 21 nodes, 23 edges, edge thickness 4×")
          PYVERIFY

          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=grid NODIFORM_SMOKE_PARAMETERS='{"dimensions":2,"range":10,"ticksPerNode":0,"finalTicks":24}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_COMPLETE=1 NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-grid-complete.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=ring-lattice NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_COMPACT=1 NODIFORM_SMOKE_COMPLETE=1 NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-ring-lattice-complete.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=grid NODIFORM_SMOKE_PARAMETERS='{"dimensions":2,"range":10,"ticksPerNode":24,"finalTicks":240}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_COMPACT=1 NODIFORM_SMOKE_ETA=1 NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-grid-preview-eta.ppm" timeout 45s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test
          NODIFORM_SMOKE_THEME=dark NODIFORM_SMOKE_EXAMPLE=grid NODIFORM_SMOKE_PARAMETERS='{"dimensions":2,"range":10,"ticksPerNode":24,"finalTicks":240,"colorBy":"birth-order"}' NODIFORM_SMOKE_TAB=inputs NODIFORM_SMOKE_INTENT=record NODIFORM_SMOKE_OUTPUT_DIR="$RUNNER_TEMP/nodiform-eta-video" NODIFORM_SMOKE_ETA=1 NODIFORM_SMOKE_SCREENSHOT="$PWD/ui-review/dark-grid-render-eta.ppm" timeout 60s xvfb-run -a -s '-screen 0 1600x1000x24' dist/Nodiform-x86_64.AppImage --appimage-extract-and-run --smoke-test

      - name: Upload native interface captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodiform-interface-review
          path: ui-review/*.ppm
          if-no-files-found: warn
          retention-days: 14

      - name: Package portable archive
        run: bash packaging/package-linux.sh

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: nodiform-linux-x86_64
          path: dist/nodiform-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload AppImage release assets
        uses: actions/upload-artifact@v4
        with:
          name: nodiform-appimage-x86_64
          path: |
            dist/Nodiform-x86_64.AppImage
            dist/Nodiform-x86_64.AppImage.zsync
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish new version to the AppImage update channel
    needs: test-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'bodee-angus/nodiform'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: nodiform-release
      cancel-in-progress: false
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4

      - name: Download tested release assets
        uses: actions/download-artifact@v4
        with:
          name: nodiform-appimage-x86_64
          path: dist

      - name: Verify downloaded bytes
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Publish only if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
          NODIFORM_VERSION: ${{ needs.test-and-package.outputs.version }}
        run: node packaging/publish-release.mjs
